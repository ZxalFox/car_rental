services:
  web:
    build:
      context: .
      dockerfile: compose/local/Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin123
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  gatsby:
    build:
      context: frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      GATSBY_API_URL: ${GATSBY_API_URL:-http://localhost:8000}
      GATSBY_RENTAL_URL: ${GATSBY_RENTAL_URL:-http://localhost:8000}
      GATSBY_PORT: ${GATSBY_PORT:-8001}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${GATSBY_PORT:-8001}:${GATSBY_PORT:-8001}"
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  pgdata:
  frontend_node_modules:
